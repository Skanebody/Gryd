# ⚠️ GABARIT — à déplacer vers .github/workflows/ci.yml PAR BELOU :
#   git mv docs/ci/ci.yml .github/workflows/ci.yml && git commit && git push
# Motif : les tokens OAuth de cette session n'ont pas le scope `workflow`
# (GitHub refuse la création de workflows sans lui). Une commande, une fois.
# GRYD — CI (MASTER §6.1 : lint + typecheck + tests à chaque PR)
# Miroir exact de `npm run gate` : ce qui est vert ici est ce qui est vert en local.
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: npm ci
      - run: npm run typecheck
      # Drift : la copie _shared/ doit être EXACTEMENT ce que le sync régénère.
      - run: node scripts/sync-game-rules.mjs && git diff --exit-code
      - run: npm run audit:migrations
      - run: npm run test:packages
      - run: npm run test:mobile
      - run: npm run test:functions
      - run: npm run test:sql
