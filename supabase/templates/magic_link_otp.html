<!doctype html>
<html lang="fr">
  <body style="margin:0;background:#0A0A0A;color:#FAFAFA;font-family:Arial,sans-serif">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#0A0A0A">
      <tr>
        <td align="center" style="padding:32px 16px">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:480px;border:1px solid #303030;border-radius:24px;background:#171717">
            <tr><td style="padding:28px 28px 8px;color:#B4FF0D;font-size:13px;font-weight:700;letter-spacing:2px">GRYD</td></tr>
            <tr><td style="padding:8px 28px;color:#FAFAFA;font-size:25px;font-weight:700;line-height:1.2">Ton code de connexion</td></tr>
            <tr><td style="padding:12px 28px;color:#A3A3A3;font-size:15px;line-height:1.5">Saisis ce code dans GRYD. Il est personnel et expire rapidement.</td></tr>
            <tr><td align="center" style="padding:22px 28px">
              <div style="border-radius:16px;background:#FAFAFA;color:#0A0A0A;font-family:monospace;font-size:32px;font-weight:700;letter-spacing:8px;padding:18px 12px">{{ .Token }}</div>
            </td></tr>
            <tr><td style="padding:8px 28px 28px;color:#A3A3A3;font-size:13px;line-height:1.5">Tu n’as rien demandé ? Ignore cet e-mail. Ne partage jamais ce code.</td></tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
